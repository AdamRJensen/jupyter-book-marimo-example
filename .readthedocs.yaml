version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
    nodejs: "22"
  jobs:
    build:
      html:
        - uv run jupyter-book build --html
        - mkdir -p "$READTHEDOCS_OUTPUT/html/"
        - cp -r _build/html/. "$READTHEDOCS_OUTPUT/html/"
        - rm -rf _build

python:
  install:
    - method: uv
      command: sync
